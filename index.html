<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d1117;--sf:#161b22;--sf2:#1c2128;
  --bd:#30363d;--bd2:#21262d;
  --tx:#e6edf3;--mu:#8b949e;
  --ac:#58a6ff;--pu:#bc8cff;
  --sh:0 6px 28px rgba(0,0,0,.45);
  --dot-c:rgba(255,255,255,.055);
  --coral:#ff7b72;--sky:#79c0ff;--sage:#7ee787;--lav:#d2a8ff;
  --amber:#e3b341;--teal:#39d3c3;--rose:#f778ba;--mint:#56d364;
}
[data-theme="light"]{
  --bg:#f4f2ec;--sf:#ffffff;--sf2:#f8f7f4;
  --bd:#dedad0;--bd2:#e9e6df;
  --tx:#1a1916;--mu:#7a7670;
  --ac:#0969da;--pu:#8250df;
  --sh:0 6px 28px rgba(0,0,0,.1);
  --dot-c:rgba(0,0,0,.045);
  --coral:#cf222e;--sky:#0969da;--sage:#1a7f37;--lav:#8250df;
  --amber:#9a6700;--teal:#0e7490;--rose:#bf3989;--mint:#116329;
}

html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Outfit',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--dot-c) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
#hdr{display:flex;align-items:center;gap:12px;padding:13px 24px;background:var(--bg);border-bottom:1px solid var(--bd);flex-shrink:0;z-index:100}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer;border-radius:8px}
.logo:hover{color:var(--ac)}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--ac),var(--pu));border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.logo-mark svg{stroke:#fff;fill:none;width:16px;height:16px;stroke-width:2.2}
.hdr-sep{width:1px;height:22px;background:var(--bd);flex-shrink:0}
.hdr-r{display:flex;align-items:center;gap:10px;flex:1}
input.fi{background:var(--sf);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:7px 12px;outline:none;width:185px;transition:border-color .15s}
input.fi:focus{border-color:var(--ac)}
input.fi::placeholder{color:var(--mu)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:7px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn svg{stroke:currentColor;fill:none;flex-shrink:0}
.bp{background:var(--ac);color:#fff;border-color:var(--ac)}
.bp:hover{opacity:.85}
.bg{background:transparent;color:var(--mu);border-color:var(--bd)}
.bg:hover{color:var(--tx);border-color:var(--mu)}
.ib{background:transparent;border:none;color:var(--mu);padding:7px;border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:color .15s,background .15s}
.ib:hover{color:var(--tx);background:var(--sf)}
.ib svg{stroke:currentColor;fill:none;display:block;width:18px;height:18px;stroke-width:1.7}
#spin{display:none;align-items:center;gap:8px;color:var(--mu);font-size:13px}
#spin.on{display:flex}
.spn{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Views ── */
#main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;transition:opacity .22s ease,transform .22s ease;opacity:0;pointer-events:none;transform:translateY(8px)}
.view.shown{opacity:1;pointer-events:all;transform:none}

/* ── VIEW 1: Category Boxes ── */
#v1{overflow-y:auto;padding:24px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:18px;align-items:start}

/* ── Category box ── */
.cbox{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s,opacity .15s}
/* An expanded box takes the full row so a long category doesn't leave the other grid column blank */
.cbox.expanded{grid-column:1/-1}
.cbox.dragging-box{opacity:.45}
/* Insert-before/after indicators for box reordering */
.cbox.drop-left{box-shadow:inset 4px 0 0 var(--ac),0 0 0 2px color-mix(in srgb,var(--ac) 20%,transparent);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.cbox.drop-right{box-shadow:inset -4px 0 0 var(--ac),0 0 0 2px color-mix(in srgb,var(--ac) 20%,transparent);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.cbox.dov{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent)}

.bh{display:flex;align-items:center;gap:10px;padding:14px 18px 14px 6px;border-bottom:1px solid var(--bd);position:relative}
.bh::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--cc,transparent)}

/* Grip handle — visual only, whole header is now the drag surface */
.grip{color:var(--bd);padding:4px 6px 4px 8px;display:flex;align-items:center;flex-shrink:0;pointer-events:none}
.grip svg{display:block;width:10px;height:14px}
.bh{cursor:grab}
.bh:active{cursor:grabbing}
.cbox.dragging-box .bh{cursor:grabbing}

.bdot2{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:var(--cc,var(--mu))}
.bname{font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--cc,var(--tx));flex:1;min-width:0}
.bname-in{font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;color:var(--tx);background:var(--sf2);border:1px solid var(--ac);border-radius:5px;padding:3px 9px;outline:none;flex:1;min-width:60px;max-width:200px}
.bcnt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mu);background:var(--bg);border:1px solid var(--bd2);border-radius:10px;padding:2px 9px;flex-shrink:0}
.bacts{display:flex;gap:3px;flex-shrink:0}
.bic{background:transparent;border:none;color:var(--mu);padding:5px;border-radius:5px;cursor:pointer;display:grid;place-items:center;transition:color .15s,background .15s}
.bic:hover{color:var(--tx);background:var(--sf2)}
.bic svg{stroke:currentColor;fill:none;display:block;width:15px;height:15px;stroke-width:1.8}
.bic.del:hover{color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,transparent)}

.bbd{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;min-height:90px}
.bempty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;height:70px;border:1px dashed var(--bd);border-radius:8px;color:var(--mu);font-size:13px;transition:border-color .15s,color .15s}
.bbd.dov-body .bempty{border-color:var(--ac);color:var(--ac)}

/* color picker strip */
.cpstrip{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--bd)}
.cp{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s}
.cp:hover{transform:scale(1.25)}
.cp.sel{border-color:var(--tx)}

/* ── Repo card ── */
.rcard{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:14px;cursor:grab;transition:border-color .15s,box-shadow .15s,transform .15s;position:relative}
.rcard.selected{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 18%,transparent)}
.rcard:active{cursor:grabbing}
.rcard[draggable="false"]{cursor:pointer}
.rcard:hover{border-color:var(--bd);transform:translateY(-2px);box-shadow:var(--sh)}
.rcard.dragging-card{opacity:.3;pointer-events:none}
/* Drop-before/after indicator lines */
.rcard.drop-before{border-top-color:var(--ac);border-top-width:2px;padding-top:13px}
.rcard.drop-after{border-bottom-color:var(--ac);border-bottom-width:2px;padding-bottom:13px}

.rt{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}
.rn{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:400;color:var(--tx);word-break:break-all;line-height:1.4;flex:1;min-width:0}
.select-btn{width:17px;height:17px;border:1px solid var(--bd);background:var(--bg);border-radius:4px;color:transparent;display:grid;place-items:center;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all .15s}
.select-btn:hover{border-color:var(--ac)}
.select-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.select-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3}
.rmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.preview-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid;white-space:nowrap}
.preview-pill.on{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 35%,transparent);background:color-mix(in srgb,var(--sage) 8%,transparent)}
.preview-pill.off{color:var(--mu);border-color:var(--bd);background:transparent}

/* ── Star button ── */
.star-btn{background:transparent;border:none;color:var(--bd);padding:2px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:color .15s,transform .15s;border-radius:4px;margin-top:1px}
.star-btn:hover{color:var(--amber);transform:scale(1.25)}
.star-btn.on{color:var(--amber)}
.star-btn svg{display:block;width:13px;height:13px;stroke-width:2;stroke:currentColor;fill:none}
.star-btn.on svg{fill:var(--amber)}

/* Category badge (used in Favourites cards) */
.cat-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid var(--bd2);background:var(--bg);color:var(--mu);flex-shrink:0;white-space:nowrap}

/* ── Favourites box ── */
.fav-box{background:var(--sf);border:1px solid color-mix(in srgb,var(--amber) 30%,var(--bd));border-radius:12px;overflow:hidden;grid-column:1/-1}
.fav-bh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid color-mix(in srgb,var(--amber) 20%,var(--bd));position:relative}
.fav-bh::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--amber)}
.fav-name{font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--amber);flex:1}
.lb{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:9px;border:1px solid;align-self:flex-start;white-space:nowrap}
.l-html{color:#e8672c;border-color:rgba(232,103,44,.3);background:rgba(232,103,44,.08)}
.l-javascript{color:#c9aa00;border-color:rgba(201,170,0,.3);background:rgba(201,170,0,.08)}
.l-typescript{color:#3178c6;border-color:rgba(49,120,198,.3);background:rgba(49,120,198,.08)}
.l-python{color:#3572a5;border-color:rgba(53,114,165,.3);background:rgba(53,114,165,.08)}
.l-go{color:#00add8;border-color:rgba(0,173,216,.3);background:rgba(0,173,216,.08)}
.l-other{color:var(--mu);border-color:var(--bd);background:transparent}
.rd{font-size:12.5px;color:var(--mu);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:9px}
.rd.ai::before{content:'✦ ';color:var(--pu);font-size:10px}
.rb{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rdate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mu)}
.csel{background:var(--bg);border:1px solid var(--bd);border-radius:5px;color:var(--mu);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 6px;cursor:pointer;outline:none;transition:border-color .15s;max-width:110px}
.csel:hover{border-color:var(--ac);color:var(--tx)}
.card-actions{display:flex;align-items:center;gap:5px;margin-top:10px}
.act-btn{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--mu);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;padding:4px 8px;text-decoration:none;transition:all .15s}
.act-btn:hover{color:var(--tx);border-color:var(--ac)}
.act-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.act-btn.disabled{opacity:.45;pointer-events:none}

/* Bulk tools */
.bulk-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.bulk-title{font-weight:700;font-size:13px;color:var(--tx);margin-right:auto}
.bulk-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mu);margin-left:4px}
.bulk-select{background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;padding:7px 10px;outline:none;max-width:160px}
.bulk-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--bd);border-radius:7px;color:var(--mu);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;padding:7px 10px;cursor:pointer;transition:all .15s}
.bulk-btn:hover:not(:disabled){color:var(--tx);border-color:var(--ac)}
.bulk-btn:disabled{opacity:.45;cursor:not-allowed}
.bulk-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.3}

/* Expand button */
.expand-btn{grid-column:1/-1;width:100%;background:transparent;border:1px dashed var(--bd);border-radius:7px;color:var(--mu);font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;padding:8px;cursor:pointer;transition:all .15s}
.expand-btn:hover{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 4%,transparent)}

/* Add tile */
.add-tile{background:transparent;border:2px dashed var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:120px;cursor:pointer;color:var(--mu);transition:all .15s;font-size:14px;font-weight:500;padding:24px}
.add-tile:hover{border-color:var(--ac);color:var(--tx);background:color-mix(in srgb,var(--ac) 4%,transparent)}
.add-tile svg{stroke:currentColor;fill:none;width:24px;height:24px;stroke-width:1.5}
.new-panel{background:var(--sf);border:1px solid var(--ac);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.np-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
.np-in{font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;color:var(--tx);padding:9px 12px;outline:none;width:100%;transition:border-color .15s}
.np-in:focus{border-color:var(--ac)}
.np-in::placeholder{color:var(--mu);font-weight:400}
.np-btns{display:flex;gap:8px;justify-content:flex-end}

/* ── VIEW 2: Detail ── */
#v2{display:flex;flex-direction:column}
.dl{flex:1;display:grid;grid-template-columns:1fr 400px;overflow:hidden;height:100%}
.pp{display:flex;flex-direction:column;border-right:1px solid var(--bd);overflow:hidden}
.ptb{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0}
.dots{display:flex;gap:6px;flex-shrink:0}
.dot{width:11px;height:11px;border-radius:50%}
.dr{background:#ff5f57}.dy{background:#ffbd2e}.dg{background:#28c840}
.addr{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:5px 11px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vptgl{display:flex;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:2px}
.vpb{background:transparent;border:none;color:var(--mu);padding:4px 8px;border-radius:4px;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.vpb.act{background:var(--sf);color:var(--tx)}
.vpb:hover:not(.act){color:var(--tx)}
.vpb svg{stroke:currentColor;fill:none;display:block;width:15px;height:15px;stroke-width:1.75}
.pfw{flex:1;overflow:hidden;background:color-mix(in srgb,var(--bg) 60%,#000 40%);position:relative}
[data-theme="light"] .pfw{background:#e4e3de}
.pif{position:absolute;inset:0;border:none;width:100%;height:100%;display:block}
.pfw.vp-tablet{padding:16px}
.pfw.vp-tablet .pif{position:relative;inset:auto;width:100%;height:100%;border:1px solid var(--bd);border-radius:8px}
.pfw.vp-mobile{display:flex;align-items:flex-start;justify-content:center;padding:20px}
.pfw.vp-mobile .pif{position:relative;inset:auto;width:390px;max-width:100%;height:100%;flex-shrink:0;border:1px solid var(--bd);border-radius:10px}
.pfb{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:var(--mu);text-align:center;padding:32px}
.pfb.on{display:flex}
.ftv{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:18px 20px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;color:var(--mu);max-height:55vh;overflow-y:auto;min-width:280px;text-align:left;width:100%;max-width:440px}

/* Sidebar */
.dsb{overflow-y:auto;background:var(--sf);display:flex;flex-direction:column}
.sbt{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;position:sticky;top:0;background:var(--sf);z-index:10}
.sbb{padding:22px 20px;display:flex;flex-direction:column;gap:20px}
.sbn{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:400;color:var(--tx);margin-bottom:5px;word-break:break-all;line-height:1.3}
.sbm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbd{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mu)}
.sect{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:8px}
.csel-lg{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;padding:9px 12px;cursor:pointer;outline:none;transition:border-color .15s}
.csel-lg:focus{border-color:var(--ac)}
.aibox{background:color-mix(in srgb,var(--pu) 6%,transparent);border:1px solid color-mix(in srgb,var(--pu) 22%,transparent);border-left:3px solid var(--pu);border-radius:0 8px 8px 0;padding:14px 16px;font-size:13.5px;line-height:1.75;color:var(--mu)}
.ailbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--pu);margin-bottom:8px}
.ailbl svg{stroke:currentColor;fill:none;width:12px;height:12px;stroke-width:2.5}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:10px 13px}
.stl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.stv{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--tx);font-weight:500}
.fl{display:flex;flex-direction:column;gap:1px;max-height:220px;overflow-y:auto}
.fl .fi{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mu);padding:5px 10px;border-radius:5px;transition:background .15s}
.fl .fi:hover{background:var(--sf2);color:var(--tx)}

.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:160px;border:1px dashed var(--bd);border-radius:12px;color:var(--mu);text-align:center}
.empty-state strong{font-size:15px;color:var(--tx)}
.empty-state span{font-size:13px}

/* Welcome (no account loaded yet) */
.welcome{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:60vh;border:1px dashed var(--bd);border-radius:12px;color:var(--mu);text-align:center;padding:32px}
.welcome .logo-mark{width:44px;height:44px;border-radius:11px;margin-bottom:8px}
.welcome .logo-mark svg{width:20px;height:20px}
.welcome strong{font-size:18px;color:var(--tx)}
.welcome span{font-size:14px;max-width:340px}
.welcome-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.welcome-row input.fi{width:220px}

/* Settings */
#sp{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:flex-end;padding:20px;pointer-events:none}
#sp.open{pointer-events:all}
#spbg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .22s ease}
#sp.open #spbg{opacity:1}
.sdrw{position:relative;z-index:1;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:24px;width:320px;box-shadow:0 24px 64px rgba(0,0,0,.4);transform:translateY(14px) scale(.97);opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
#sp.open .sdrw{transform:none;opacity:1}
.stit{font-weight:700;font-size:16px;margin-bottom:18px}
.sfd{margin-bottom:16px}
.slbl{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.sin{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 11px;outline:none;transition:border-color .15s}
.sin:focus{border-color:var(--ac)}
.snote{font-size:12px;color:var(--mu);margin-top:5px;line-height:1.45}
.bfull{width:100%;justify-content:center;padding:10px}

/* Save toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px 18px;font-size:13px;color:var(--mu);display:flex;align-items:center;gap:8px;box-shadow:var(--sh);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;z-index:500}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast svg{fill:none;width:14px;height:14px;stroke-width:2.5}
#toast .tok{stroke:var(--sage)}
#toast .terr{stroke:var(--coral);display:none}
#toast.err .tok{display:none}
#toast.err .terr{display:block}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--mu)}

.cbox[data-col="coral"]{--cc:var(--coral)}
.cbox[data-col="sky"]{--cc:var(--sky)}
.cbox[data-col="sage"]{--cc:var(--sage)}
.cbox[data-col="lav"]{--cc:var(--lav)}
.cbox[data-col="amber"]{--cc:var(--amber)}
.cbox[data-col="teal"]{--cc:var(--teal)}
.cbox[data-col="rose"]{--cc:var(--rose)}
.cbox[data-col="mint"]{--cc:var(--mint)}

@media (max-width: 900px){
  #hdr{align-items:flex-start;gap:10px;padding:12px 14px;flex-wrap:wrap}
  .hdr-sep{display:none}
  .hdr-r{order:2;flex-basis:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px}
  input.fi{width:100%;min-width:0}
  #spin{grid-column:1/-1}
  #v1{padding:14px}
  .bulk-bar{flex-wrap:wrap}
  .bulk-title{flex-basis:100%;margin-right:0}
  .cat-grid{grid-template-columns:1fr;gap:14px}
  .dl{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .pp{border-right:0;border-bottom:1px solid var(--bd);min-height:48vh}
  .dsb{max-height:42vh}
  .sbb{padding:16px}
}

@media (max-width: 560px){
  #app{height:100dvh}
  #hdr{padding:10px}
  .logo{font-size:16px}
  .logo-mark{width:28px;height:28px}
  .hdr-r{grid-template-columns:1fr 44px;align-items:stretch}
  .hdr-r .btn.bp{width:44px;padding:0;justify-content:center;font-size:0;gap:0}
  .hdr-r .btn.bp svg{width:16px;height:16px}
  #srch{grid-column:1/-1;max-width:none!important}
  .bh,.fav-bh{padding-right:12px;gap:8px}
  .bbd{grid-template-columns:1fr;padding:12px}
  .rt{align-items:flex-start;flex-wrap:nowrap}
  .rmeta,.card-actions{gap:5px}
  .act-btn{flex:1;justify-content:center}
  .bulk-select{flex:1;min-width:0}
  .bulk-btn{flex:1;justify-content:center}
  .ptb{gap:8px;padding:9px 10px;flex-wrap:wrap}
  .addr{order:3;flex-basis:100%;min-width:0}
  .pfw.vp-mobile{padding:10px}
  .pfw.vp-mobile .pif{width:100%}
  .sdrw{width:min(100%,320px)}
  #sp{padding:10px}
}
</style>

<body>
<div id="app">

    <button class="ib" id="tbtn" onclick="toggleTheme()" title="Toggle theme">

    </button>
    <button class="ib" onclick="toggleSettings()" title="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="main">
    <div id="v1" class="view shown">

      <div class="cat-grid" id="cgrid"></div>
    </div>

    <div id="v2" class="view">
      <div class="dl">
        <div class="pp">
          <div class="ptb">
            <div class="dots"><div class="dot dr"></div><div class="dot dy"></div><div class="dot dg"></div></div>
            <div class="addr" id="addr">about:blank</div>
            <button class="ib" style="padding:5px" onclick="refreshRepoData()" title="Reload repo data & preview">

            </button>
            <div class="vptgl">

                <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              </button>
              <button class="vpb" data-vp="tablet" onclick="setVp('tablet')" title="Tablet">
                <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
              </button>
              <button class="vpb" data-vp="mobile" onclick="setVp('mobile')" title="Mobile">
                <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
              </button>
            </div>
          </div>
          <div class="pfw vp-desktop" id="pfw">
            <iframe id="pif" class="pif" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" src="about:blank"></iframe>

              GitHub

          <div class="sbb">
            <div>
              <div style="display:flex;align-items:flex-start;gap:8px">
                <div class="sbn" id="sbn" style="flex:1;min-width:0"></div>
                <button class="star-btn" id="sbstar" style="margin-top:3px;width:20px;height:20px"><svg viewBox="0 0 24 24" style="width:15px;height:15px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
              </div>

            </div>

              <div class="sect">Category</div>
              <select class="csel-lg" id="sbcat" onchange="catFromSb(this.value)"></select>
            </div>
            <div>
              <div class="aibox">
                <div class="ailbl">
                  <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  AI Description
                </div>
                <div id="sbai"></div>

            <div>
              <div class="sect">Stats</div>

</div>

<div id="sp">
  <div id="spbg" onclick="toggleSettings()"></div>
  <div class="sdrw">
    <div class="stit">Settings</div>
    <div class="sfd">
      <label class="slbl">GitHub Token (optional)</label>
      <input type="password" class="sin" id="sght" placeholder="ghp_…">
      <div class="snote">Higher rate limits. Sent only to api.github.com.</div>
    </div>
    <div class="sfd">
      <label class="slbl">Claude API Key (optional)</label>
      <input type="password" class="sin" id="sclk" placeholder="sk-ant-…">
      <div class="snote">For AI descriptions. Sent only to api.anthropic.com.</div>
    </div>
    <button class="btn bp bfull" onclick="saveSettings()">Save</button>
    <div style="margin-top:8px"><button class="btn bg bfull" onclick="toggleSettings()">Close</button></div>
  </div>
</div>

<div id="toast">
  <svg class="tok" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  <svg class="terr" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <span id="toastmsg">State saved</span>
</div>

<script>
const COLORS=['coral','sky','sage','lav','amber','teal','rose','mint'];
const DEF_CATS=[{id:'fun',name:'Fun',col:'coral'},{id:'edu',name:'Edu',col:'sky'},{id:'work',name:'Work',col:'sage'},{id:'other',name:'Other',col:'lav'}];

const CAT_LIMIT=4;
let repos=[], cats=[], activeRepo=null, addingNew=false, newCol='amber';
let searchQ='', searchRe=null;
let repoOrder={};           // { catId: [name, ...] }  — order within each box
let expandedCats={};        // { catId: true }
let starred=new Set();      // repo names
let selectedRepos=new Set(); // repo names selected for bulk actions
let visibleRepoNames=new Set(); // repo names currently visible on dashboard
let dragType=null;          // 'card' | 'box'
let dragBoxId=null;
let toastTimer=null;

/* ── Storage ── */
const lsGet=(k,fb)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):fb}catch{return fb}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const ghHeaders=()=>{const h={'Accept':'application/vnd.github.v3+json'},t=lsGet('rv_s',{}).ght;if(t)h['Authorization']='token '+t;return h};
const repoOwner=r=>r.html_url.replace('https://github.com/','').split('/')[0];
const langClass=r=>(r.language||'other').toLowerCase().replace(/\s/g,'');
const catOptionsH=active=>cats.map(c=>`<option value="${c.id}"${c.id===active?' selected':''}>${esc(c.name)}</option>`).join('');
const isCardControl=e=>e.target.closest('.select-btn,.star-btn,.csel,.act-btn');

function saveState(silent){
  lsSet('rv_repos', repos);
  lsSet('rv_rc', Object.fromEntries(repos.map(r=>[r.name,r.category])));
  lsSet('rv_order', repoOrder);
  lsSet('rv_starred', [...starred]);
  if(!silent) showToast();
}
function saveCats(){ lsSet('rv_cats', cats); }
function showToast(msg,isErr){
  const t=document.getElementById('toast');
  document.getElementById('toastmsg').textContent=msg||'State saved';
  t.classList.toggle('err',!!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),isErr?4000:1800);
}

/* ── Init ── */
function init(){
  cats=lsGet('rv_cats',null)||JSON.parse(JSON.stringify(DEF_CATS));
  repoOrder=lsGet('rv_order',{});
  starred=new Set(lsGet('rv_starred',[]));
  const savedRC=lsGet('rv_rc',{});
  repos=(lsGet('rv_repos',null)||[]).map(r=>({...r,category:savedRC[r.name]||r.category}));
  document.getElementById('uname').value=lsGet('rv_user','');
  const theme=localStorage.getItem('rv_theme')||'dark';
  document.documentElement.dataset.theme=theme; setThemeIcon(theme);
  const s=lsGet('rv_s',{});
  if(s.ght) document.getElementById('sght').value=s.ght;
  if(s.clk) document.getElementById('sclk').value=s.clk;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&document.getElementById('sp').classList.contains('open')) toggleSettings();
  });
  renderDash();
}

/* ── GitHub API ── */
function loadFromWelcome(){
  const v=document.getElementById('wuname')?.value.trim();
  if(!v) return;
  document.getElementById('uname').value=v;
  loadRepos();
}

async function loadRepos(){
  const u=document.getElementById('uname').value.trim(); if(!u) return;
  const sp=document.getElementById('spin'); sp.classList.add('on');
  try{
    const res=await fetch(`https://api.github.com/users/${u}/repos?sort=pushed&per_page=100`,{headers:ghHeaders()});
    if(!res.ok) throw new Error('GitHub API '+res.status);
    const data=await res.json();
    const savedRC=lsGet('rv_rc',{}),by={};
    repos.forEach(r=>by[r.name]=r);
    repos=data.map(d=>({
      name:d.name,html_url:d.html_url,language:d.language||'Other',
      pushed_at:d.pushed_at,size:d.size,stargazers_count:d.stargazers_count,
      forks_count:d.forks_count,description:d.description,
      has_pages:d.has_pages,
      files:by[d.name]?.files||[],
      preview_url:`https://${u}.github.io/${d.name}`,
      category:savedRC[d.name]||by[d.name]?.category||'other',
      ai_description:by[d.name]?.ai_description||null
    }));
    lsSet('rv_user',u);
    saveState(); renderDash();
  }catch(e){
    const msg=/404/.test(e.message)?`User "${u}" not found on GitHub`
      :/403/.test(e.message)?'GitHub rate limit reached — add a token in Settings or try again later'
      :'Could not load repos: '+e.message;
    showToast(msg,true);
  }
  finally{sp.classList.remove('on');}
}

/* ── Ordering helpers ── */
function getOrderedRepos(catId){
  const cr=repos.filter(r=>r.category===catId);
  const order=repoOrder[catId]||[];
  const result=[];
  order.forEach(n=>{ const r=cr.find(x=>x.name===n); if(r) result.push(r); });
  cr.forEach(r=>{ if(!result.find(x=>x.name===r.name)) result.push(r); });
  return result;
}

function ensureOrder(catId){
  if(!repoOrder[catId]) repoOrder[catId]=getOrderedRepos(catId).map(r=>r.name);
}

/* Core move: mutate repos/repoOrder only — no save, render, or sidebar sync */
function placeRepo(srcName, tgtCatId, tgtName, insertBefore){
  const r=repos.find(x=>x.name===srcName); if(!r) return;
  const oldCat=r.category;
  r.category=tgtCatId;
  ensureOrder(oldCat); ensureOrder(tgtCatId);
  repoOrder[oldCat]=repoOrder[oldCat].filter(n=>n!==srcName);
  repoOrder[tgtCatId]=repoOrder[tgtCatId].filter(n=>n!==srcName&&repos.some(x=>x.name===n));
  const arr=repoOrder[tgtCatId];
  if(!tgtName){ arr.push(srcName); }
  else{
    const ti=arr.indexOf(tgtName);
    ti===-1 ? arr.push(srcName) : arr.splice(insertBefore?ti:ti+1,0,srcName);
  }
}

/* Move a repo to catId, inserting before/after tgtName (null = append) */
function moveRepo(srcName, tgtCatId, tgtName, insertBefore){
  const r=repos.find(x=>x.name===srcName); if(!r||srcName===tgtName) return;
  placeRepo(srcName, tgtCatId, tgtName, insertBefore);
  saveState(); renderDash();
  if(activeRepo?.name===srcName) fillSbCat(tgtCatId);
}

/* Move a category box before/after another in the cats array */
function moveCat(srcId, tgtId, before){
  const si=cats.findIndex(c=>c.id===srcId), ti=cats.findIndex(c=>c.id===tgtId);
  if(si===-1||ti===-1||si===ti) return;
  const [src]=cats.splice(si,1);
  const newTi=cats.findIndex(c=>c.id===tgtId);
  cats.splice(before?newTi:newTi+1,0,src);
  saveCats(); renderDash();
}

/* ── Render ── */
function renderDash(){
  const grid=document.getElementById('cgrid');
  document.getElementById('bulkbar').style.display=repos.length?'':'none';
  if(repos.length===0){
    grid.innerHTML=`<div class="welcome">
      <div class="logo-mark"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
      <strong>No account connected</strong>
      <span>Enter a GitHub username to load and organize its repositories.</span>
      <div class="welcome-row">
        <input type="text" class="fi" id="wuname" placeholder="github username" onkeydown="if(event.key==='Enter')loadFromWelcome()">
        <button class="btn bp" onclick="loadFromWelcome()">Load Repos</button>
      </div>
    </div>`;
    setTimeout(()=>document.getElementById('wuname')?.focus(),40);
    return;
  }
  grid.innerHTML='';
  let visibleSections=0;
  const existingNames=new Set(repos.map(r=>r.name));
  selectedRepos=new Set([...selectedRepos].filter(n=>existingNames.has(n)));
  visibleRepoNames=new Set();

  /* ── Favourites box (auto, read-only) ── */
  const favRepos=repos.filter(r=>starred.has(r.name)&&matchSearch(r));
  if(favRepos.length>0){
    visibleSections++;
    favRepos.forEach(r=>visibleRepoNames.add(r.name));
    const fbox=document.createElement('div');
    fbox.className='fav-box';
    fbox.innerHTML=`
      <div class="fav-bh">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;flex-shrink:0;stroke:var(--amber);fill:var(--amber);stroke-width:2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span class="fav-name">Favourites</span>
        <span class="bcnt">${favRepos.length}</span>
      </div>
      <div class="bbd" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
        ${favRepos.map(r=>cardH(r,true)).join('')}
      </div>`;
    grid.appendChild(fbox);
    // click wiring comes from the generic .rcard pass below — fav cards are in the DOM by then
  }

  cats.forEach(cat=>{
    const cr=getOrderedRepos(cat.id).filter(matchSearch);
    if(searchQ&&cr.length===0)return;
    visibleSections++;
    const shownRepos=searchQ||expandedCats[cat.id]?cr:cr.slice(0,CAT_LIMIT);
    shownRepos.forEach(r=>visibleRepoNames.add(r.name));
    const isBuiltin=['fun','edu','work','other'].includes(cat.id);
    const canDel=!isBuiltin&&cr.length===0;
    const box=document.createElement('div');
    box.className='cbox'+(expandedCats[cat.id]&&cr.length>CAT_LIMIT?' expanded':'');
    box.dataset.col=cat.col; box.dataset.cid=cat.id;
    box.innerHTML=`
      <div class="bh">
        <div class="grip" title="Drag to reorder box">
          <svg viewBox="0 0 10 16" fill="currentColor">
            <circle cx="3" cy="2.5" r="1.2"/><circle cx="7" cy="2.5" r="1.2"/>
            <circle cx="3" cy="8" r="1.2"/><circle cx="7" cy="8" r="1.2"/>
            <circle cx="3" cy="13.5" r="1.2"/><circle cx="7" cy="13.5" r="1.2"/>
          </svg>
        </div>
        <div class="bdot2"></div>
        <span class="bname" id="bn-${cat.id}">${esc(cat.name)}</span>
        <span class="bcnt">${cr.length}</span>
        <div class="bacts">
          <button class="bic" onclick="startRename('${cat.id}')" title="Rename">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          ${canDel?`<button class="bic del" onclick="delCat('${cat.id}')" title="Delete">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>`:''}
        </div>
      </div>
      <div class="bbd" id="bb-${cat.id}" data-cid="${cat.id}">
        ${cr.length===0?'<div class="bempty">Drop repos here</div>':''}
        ${shownRepos.map(r=>cardH(r,false)).join('')}
        ${!searchQ&&cr.length>CAT_LIMIT?`<button class="expand-btn" onclick="toggleExpand('${cat.id}')">${expandedCats[cat.id]?'Show less ↑':'Show '+(cr.length-CAT_LIMIT)+' more ↓'}</button>`:''}
      </div>`;
    grid.appendChild(box);

    /* ── Box drag (whole header is the drag surface) ── */
    const header=box.querySelector('.bh');
    header.draggable=true;
    header.addEventListener('dragstart',e=>{
      if(e.target.closest('.bacts')||e.target.closest('.bname-in')){e.preventDefault();return;}
      e.stopPropagation();
      dragType='box'; dragBoxId=cat.id;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('box',cat.id);
      requestAnimationFrame(()=>box.classList.add('dragging-box'));
    });
    header.addEventListener('dragend',()=>{
      dragType=null; dragBoxId=null;
      box.classList.remove('dragging-box');
      document.querySelectorAll('.cbox').forEach(b=>b.classList.remove('drop-left','drop-right'));
    });

    /* ── Box as drop target (for both box and card drags) ── */
    box.addEventListener('dragover',e=>{
      if(dragType==='box'&&dragBoxId!==cat.id){
        e.preventDefault();
        const rect=box.getBoundingClientRect(), mid=rect.left+rect.width/2;
        box.classList.toggle('drop-left', e.clientX<mid);
        box.classList.toggle('drop-right', e.clientX>=mid);
      }
    });
    box.addEventListener('dragleave',e=>{
      if(!box.contains(e.relatedTarget)) box.classList.remove('drop-left','drop-right','dov');
    });
    box.addEventListener('drop',e=>{
      if(dragType==='box'&&dragBoxId!==cat.id){
        e.preventDefault();
        const rect=box.getBoundingClientRect();
        moveCat(dragBoxId, cat.id, e.clientX<rect.left+rect.width/2);
      }
      box.classList.remove('drop-left','drop-right');
    });

    /* ── Box body as card drop target (empty zone or body padding) ── */
    const body=box.querySelector('.bbd');
    body.addEventListener('dragover',e=>{
      if(dragType!=='card') return;
      if(e.target.closest('.rcard')) return; // handled by card
      e.preventDefault(); e.stopPropagation();
      body.classList.add('dov-body'); box.classList.add('dov');
    });
    body.addEventListener('dragleave',e=>{
      if(!body.contains(e.relatedTarget)){ body.classList.remove('dov-body'); box.classList.remove('dov'); }
    });
    body.addEventListener('drop',e=>{
      if(dragType!=='card') return;
      if(e.target.closest('.rcard')) return;
      e.preventDefault(); e.stopPropagation();
      body.classList.remove('dov-body'); box.classList.remove('dov');
      const n=e.dataTransfer.getData('rn');
      if(n) moveRepo(n, cat.id, null, false);
    });
  });

  if(searchQ&&visibleSections===0){
    const empty=document.createElement('div');
    empty.className='empty-state';
    empty.innerHTML=`<strong>No matching repositories</strong><span>Try a different repo name, language, or description.</span>`;
    grid.appendChild(empty);
  }
  renderBulkBar();

  /* ── Add category tile ── */
  const slot=document.createElement('div');
  if(addingNew){
    slot.className='new-panel';
    slot.innerHTML=`
      <div class="np-lbl">New Category Name</div>
      <input class="np-in" id="npin" type="text" placeholder="e.g. Archive, Side projects, Learning…">
      <div class="cpstrip">${COLORS.map(c=>`<div class="cp${c===newCol?' sel':''}" style="background:var(--${c})" onclick="pickCol('${c}')" title="${c}"></div>`).join('')}</div>
      <div class="np-btns">
        <button class="btn bg" style="padding:6px 13px;font-size:13px" onclick="cancelNew()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Cancel
        </button>
        <button class="btn bp" style="padding:6px 13px;font-size:13px" onclick="confirmNew()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Add
        </button>
      </div>`;
    grid.appendChild(slot);
    setTimeout(()=>{
      const inp=document.getElementById('npin');
      if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')confirmNew();if(e.key==='Escape')cancelNew();});}
    },40);
  } else {
    slot.className='add-tile';
    slot.innerHTML=`<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add Category</span>`;
    slot.onclick=()=>{addingNew=true;renderDash();};
    grid.appendChild(slot);
  }

  /* ── Card drag events ── */
  document.querySelectorAll('.rcard').forEach(card=>{
    if(card.getAttribute('draggable')!=='false'){
      card.addEventListener('dragstart',e=>{
        if(isCardControl(e)){e.preventDefault();return;}
        e.stopPropagation();
        dragType='card';
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('rn',card.dataset.r);
        requestAnimationFrame(()=>card.classList.add('dragging-card'));
      });
      card.addEventListener('dragend',()=>{
        dragType=null;
        card.classList.remove('dragging-card');
        document.querySelectorAll('.rcard').forEach(c=>c.classList.remove('drop-before','drop-after'));
      });
      card.addEventListener('dragover',e=>{
        if(dragType!=='card') return;
        e.preventDefault(); e.stopPropagation();
        const rect=card.getBoundingClientRect(), mid=rect.top+rect.height/2;
        const before=e.clientY<mid;
        card.classList.toggle('drop-before',before);
        card.classList.toggle('drop-after',!before);
        // clear indicators on other cards
        document.querySelectorAll('.rcard').forEach(c=>{
          if(c!==card){ c.classList.remove('drop-before','drop-after'); }
        });
      });
      card.addEventListener('dragleave',e=>{
        if(!card.contains(e.relatedTarget)) card.classList.remove('drop-before','drop-after');
      });
      card.addEventListener('drop',e=>{
        if(dragType!=='card') return;
        e.preventDefault(); e.stopPropagation();
        card.classList.remove('drop-before','drop-after');
        const srcName=e.dataTransfer.getData('rn');
        const tgtName=card.dataset.r;
        const tgtCatId=card.closest('.bbd').dataset.cid;
        const rect=card.getBoundingClientRect();
        moveRepo(srcName, tgtCatId, tgtName, e.clientY<rect.top+rect.height/2);
      });
    }
    card.addEventListener('click',e=>{
      if(isCardControl(e)) return;
      const r=repos.find(x=>x.name===card.dataset.r);
      if(r) showDetail(r);
    });
  });
}

function renderBulkBar(){
  const bar=document.getElementById('bulkbar');
  const count=selectedRepos.size;
  const selectIcon='<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>';
  const moveIcon='<svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';
  const clearIcon='<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  bar.innerHTML=`
    <div class="bulk-title">Bulk organize <span class="bulk-count">${count} selected</span></div>

function toggleSelected(name){
  if(selectedRepos.has(name)) selectedRepos.delete(name); else selectedRepos.add(name);
  renderDash();
}

function selectVisibleRepos(){
  visibleRepoNames.forEach(n=>selectedRepos.add(n));
  renderDash();
}

function clearSelection(){
  selectedRepos.clear();
  renderDash();
}

function bulkMoveSelected(){
  const catId=document.getElementById('bulkcat')?.value;
  if(!catId||selectedRepos.size===0) return;
  const names=[...selectedRepos].filter(n=>repos.some(r=>r.name===n));
  names.forEach(name=>{
    const r=repos.find(x=>x.name===name);
    if(!r||r.category===catId) return;
    placeRepo(name, catId, null, false);
  });
  selectedRepos.clear();
  saveState();
  renderDash();
  if(activeRepo&&names.includes(activeRepo.name)) fillSbCat(activeRepo.category);
}

function hasPreview(r){
  // Trust GitHub's has_pages flag — covers repos whose site is served from /docs or a
  // branch (e.g. data/), where index.html isn't in the repo root and language may be null.
  return !!(r.preview_url&&(r.has_pages||r.language==='HTML'||r.language==='JavaScript'||(r.files||[]).includes('index.html')));
}

/* ── Category ops ── */
function setcat(name,catId){
  const r=repos.find(x=>x.name===name); if(!r||r.category===catId) return;
  moveRepo(name,catId,null,false);
}
function catFromSb(v){if(activeRepo) setcat(activeRepo.name,v);}

function startRename(id){
  const el=document.getElementById('bn-'+id); if(!el) return;
  const cur=cats.find(c=>c.id===id)?.name||'';
  const inp=document.createElement('input');
  inp.className='bname-in'; inp.value=cur;
  el.replaceWith(inp); inp.focus(); inp.select();
  const done=()=>{
    const v=inp.value.trim();
    if(v){const c=cats.find(x=>x.id===id);if(c){c.name=v;saveCats();}}
    renderDash();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')done();if(e.key==='Escape')renderDash();});
  inp.addEventListener('blur',done);
}

function toggleStar(name){
  if(starred.has(name)) starred.delete(name); else starred.add(name);
  saveState(true);
  renderDash();
}

function toggleExpand(catId){ expandedCats[catId]=!expandedCats[catId]; renderDash(); }

function delCat(id){
  if(repos.some(r=>r.category===id)){showToast('Move all repos out of this category first',true);return;}
  cats=cats.filter(c=>c.id!==id); saveCats(); renderDash();
}

function pickCol(c){newCol=c;renderDash();}
function cancelNew(){addingNew=false;renderDash();}
function confirmNew(){
  const inp=document.getElementById('npin');
  const name=inp?.value?.trim(); if(!name) return;
  const id='c'+Date.now();
  cats.push({id,name,col:newCol});
  newCol=COLORS[(COLORS.indexOf(newCol)+1)%COLORS.length];
  addingNew=false; saveCats(); renderDash();
}

/* ── Detail view ── */
function showDetail(r){
  activeRepo=r;
  document.getElementById('sbn').textContent=r.name;
  const lb=document.getElementById('sblng'); lb.textContent=r.language||'?'; lb.className='lb l-'+langClass(r);
  document.getElementById('sbdt').textContent='pushed '+fdate(r.pushed_at);
  const sbstar=document.getElementById('sbstar');
  sbstar.className='star-btn'+(starred.has(r.name)?' on':'');
  sbstar.title=starred.has(r.name)?'Unstar':'Star';
  // Update the button in place — a full showDetail would needlessly reload the preview iframe
  sbstar.onclick=()=>{
    toggleStar(r.name);
    sbstar.classList.toggle('on',starred.has(r.name));
    sbstar.title=starred.has(r.name)?'Unstar':'Star';
  };
  fillSbCat(r.category);
  document.getElementById('ghlink').href=r.html_url;
  renderAiBox(r);
  document.getElementById('sbst').innerHTML=[
    {l:'Stars',v:'★ '+r.stargazers_count},{l:'Forks',v:'⑂ '+r.forks_count},
    {l:'Language',v:r.language||'—'},{l:'Size',v:fsize(r.size)}
  ].map(s=>`<div class="st"><div class="stl">${s.l}</div><div class="stv">${esc(s.v)}</div></div>`).join('');
  document.getElementById('sbfl').innerHTML=(r.files||[]).map(f=>`<div class="fi">${esc(f)}</div>`).join('')||'<div class="fi" style="font-style:italic;color:var(--mu)">No file data</div>';
  const hasPv=hasPreview(r);

  if(hasPv){ifr.style.display='block';fb.classList.remove('on');ifr.src=bust(r.preview_url);}
  else{ifr.style.display='none';fb.classList.add('on');showFileFallback(r);}
  sv('v1','v2'); setVp('desktop');

async function generateAiDesc(){
  const key=lsGet('rv_s',{}).clk;
  if(!key){toggleSettings();return;}
  const r=activeRepo; if(!r) return;

  const ai=document.getElementById('sbai');
  ai.innerHTML='<em style="color:var(--mu);font-size:13px">Generating…</em><span class="spn" style="margin-left:8px;display:inline-block"></span>';

  try{
    const owner=repoOwner(r);

    // 1. Ensure we have a file list — fetch it if missing
    let files=r.files||[];
    if(files.length===0){
      const listRes=await fetch(`https://api.github.com/repos/${owner}/${r.name}/contents`,{headers:ghHeaders()});
      if(listRes.ok){
        const items=await listRes.json();
        files=items.map(i=>i.name);
        r.files=files;
        saveState();
      }
    }

    // 2. Pick key file: code entry point first, README as fallback
    const CODE_PRIO=['index.html','app.html','main.py','app.py','index.js','app.js','main.js','main.go','main.ts','App.tsx','App.jsx'];
    const keyFile=CODE_PRIO.find(f=>files.includes(f))||files.find(f=>/readme/i.test(f))||files[0];

    // 3. Fetch file content — try main then master branch
    let fileContent='';
    if(keyFile){
      for(const branch of ['main','master']){
        const res=await fetch(`https://raw.githubusercontent.com/${owner}/${r.name}/${branch}/${keyFile}`);
        if(res.ok){fileContent=(await res.text()).slice(0,6000);break;}
      }
    }

    const prompt=`Repository: ${r.name}
Language: ${r.language||'unknown'}
All files: ${files.join(', ')||'(unavailable)'}
${fileContent?`\nKey file (${keyFile}):\n\`\`\`\n${fileContent}\n\`\`\`\n`:''}
Write a 2–3 sentence description of what this repository does. Be specific and concrete. No preamble, start directly.`;

    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'content-type':'application/json',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:200,
        messages:[{role:'user',content:prompt}]
      })
    });
    if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||'API '+resp.status);}
    const data=await resp.json();
    r.ai_description=data.content[0].text.trim();
    saveState();
    renderAiBox(r); // only the AI box changed — a full showDetail would reload the preview iframe
  }catch(e){
    ai.innerHTML=`<em style="color:var(--coral);font-size:13px">Error: ${esc(e.message)}</em>
      <button onclick="generateAiDesc()" class="btn bp" style="margin-top:10px;padding:6px 14px;font-size:13px;display:inline-flex">↺ Retry</button>`;
  }
}

function fillSbCat(active){
  document.getElementById('sbcat').innerHTML=catOptionsH(active);
}

function fileIcon(name){
  const ext=(name.split('.').pop()||'').toLowerCase();
  const m={html:'🌐',htm:'🌐',css:'🎨',js:'⚡',ts:'⚡',jsx:'⚡',tsx:'⚡',py:'🐍',go:'🐹',rs:'🦀',java:'☕',rb:'💎',php:'🐘',md:'📝',txt:'📝',json:'📋',yml:'📋',yaml:'📋',toml:'📋',png:'🖼',jpg:'🖼',jpeg:'🖼',gif:'🖼',svg:'🖼',ico:'🖼',mp4:'🎬',mp3:'🎵',pdf:'📄',zip:'📦',tar:'📦',sh:'⚙',bat:'⚙',env:'🔑',lock:'🔒'};
  return m[ext]||'📄';
}

async function showFileFallback(r){
  const ftv=document.getElementById('ftv');
  if(r.files&&r.files.length>0){
    ftv.innerHTML=r.files.map(f=>`<div style="display:flex;align-items:center;gap:8px;padding:2px 0">${fileIcon(f)}&nbsp;<span style="font-family:'IBM Plex Mono',monospace;font-size:12px">${esc(f)}</span></div>`).join('');
    return;
  }
  ftv.innerHTML='<div style="color:var(--mu);font-size:13px">Loading…</div>';
  try{
    const res=await fetch(`https://api.github.com/repos/${repoOwner(r)}/${r.name}/contents`,{headers:ghHeaders()});
    if(!res.ok) throw new Error('GitHub '+res.status);
    const items=await res.json();
    r.files=items.map(i=>i.name);
    saveState();
    ftv.innerHTML=items.map(item=>{
      const isDir=item.type==='dir';
      const icon=isDir?'📁':fileIcon(item.name);
      const sz=!isDir&&item.size?`<span style="margin-left:auto;color:var(--mu);font-size:11px;flex-shrink:0">${item.size<1024?item.size+' B':Math.ceil(item.size/1024)+' KB'}</span>`:'';
      return `<div style="display:flex;align-items:center;gap:8px;padding:3px 0">${icon}&nbsp;<span style="font-family:'IBM Plex Mono',monospace;font-size:12px;${isDir?'color:var(--tx);font-weight:500':''}">${esc(item.name)}</span>${sz}</div>`;
    }).join('')||'<div style="color:var(--mu)">Empty repository</div>';
  }catch(e){
    ftv.innerHTML=`<div style="color:var(--coral);font-size:13px">Could not load files: ${esc(e.message)}</div>`;
  }
}

function showDash(){sv('v2','v1');document.getElementById('pif').src='about:blank';}
function sv(h,s){
  document.getElementById(h).classList.remove('shown');
  document.getElementById(s).classList.add('shown');
}
function setVp(m){ document.getElementById('pfw').className='pfw vp-'+m; document.querySelectorAll('.vpb').forEach(b=>b.classList.toggle('act',b.dataset.vp===m)); }
function reloadPv(){if(activeRepo&&hasPreview(activeRepo))document.getElementById('pif').src=bust(activeRepo.preview_url);}

/* ── Theme ── */
function toggleTheme(){
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t; localStorage.setItem('rv_theme',t); setThemeIcon(t);
}
function setThemeIcon(t){
  document.getElementById('ticon').innerHTML=t==='dark'
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
}

/* ── Settings ── */
function toggleSettings(){document.getElementById('sp').classList.toggle('open');}
function saveSettings(){
  lsSet('rv_s',{ght:document.getElementById('sght').value.trim(),clk:document.getElementById('sclk').value.trim()});
  toggleSettings();
}

/* ── Helpers ── */
function fdate(iso){
  if(!iso) return '—';
  const d=new Date(iso),now=new Date(),df=Math.floor((now-d)/1e3);
  if(df<60) return 'just now'; if(df<3600) return Math.floor(df/60)+'m ago';
  if(df<86400) return Math.floor(df/3600)+'h ago'; if(df<604800) return Math.floor(df/86400)+'d ago';
  const opts={month:'short',day:'numeric'};
  if(d.getFullYear()!==now.getFullYear()) opts.year='numeric';
  return d.toLocaleDateString('en',opts);
}
function fsize(kb){return !kb?'0 KB':kb<1024?kb+' KB':(kb/1024).toFixed(1)+' MB';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Append a unique query param so the browser/GitHub Pages CDN can't serve a stale cached preview.
function bust(url){if(!url)return url;return url+(url.includes('?')?'&':'?')+'_cb='+Date.now();}


function setSearch(v){
  searchQ=v.toLowerCase().trim();
  searchRe=searchQ?new RegExp('\\b'+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'):null;
  renderDash();
}
function matchSearch(r){
  if(!searchQ)return true;
  // Name: substring match ("md2" finds md2web). Prose fields: word-start match only,
  // so "ai" matches "AI notes" but not "armchair" buried in a description.
  if(r.name.toLowerCase().includes(searchQ))return true;
  return searchRe.test(r.description||'')||searchRe.test(r.ai_description||'')||searchRe.test(r.language||'');
}

async function refreshRepoData(){
  if(!activeRepo){reloadPv();return;}
  const h=ghHeaders();
  const owner=repoOwner(activeRepo);
  try{
    // Refresh metadata AND the file list — a newly-added index.html must update hasPreview().
    const [metaRes,filesRes]=await Promise.all([
      fetch(`https://api.github.com/repos/${owner}/${activeRepo.name}`,{headers:h}),
      fetch(`https://api.github.com/repos/${owner}/${activeRepo.name}/contents`,{headers:h})
    ]);
    if(!metaRes.ok)throw new Error('GitHub '+metaRes.status);
    const d=await metaRes.json();
    let files=null;
    if(filesRes.ok){const items=await filesRes.json();if(Array.isArray(items))files=items.map(i=>i.name);}
    const idx=repos.findIndex(r=>r.name===d.name);
    if(idx!==-1){
      repos[idx]={...repos[idx],language:d.language||'Other',pushed_at:d.pushed_at,size:d.size,
        stargazers_count:d.stargazers_count,forks_count:d.forks_count,description:d.description,
        has_pages:d.has_pages,
        ...(files?{files}:{})};
      activeRepo=repos[idx];
      saveState();
      showDetail(activeRepo); // already reloads the preview — no extra reloadPv
      return;
    }
  }catch(e){console.error('Refresh failed:',e);}
  reloadPv();
}
init();
</script>
