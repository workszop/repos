name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel an in-flight Pages deploy: a cancelled deployment can deactivate the
  # one currently live and drop the whole site to 404. Queue instead — deploys are ~20s.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the build marker with the deployed commit
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          sed -i "s/data-build=\"dev\"/data-build=\"$sha\"/" index.html
          grep -q "data-build=\"$sha\"" index.html || { echo "build marker not stamped"; exit 1; }
          echo "Stamped build marker: $sha"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
